; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build all three environments by default, or specify one via CLI
default_envs = PM_PRODUCTION, PM_BETA, OTA_APP

[extra]
baud = 115200

[common]
src_dir = src
platform = espressif32
framework = arduino
upload_protocol = esptool
upload_speed = 460800
upload_resetmethod = no_reset
board_upload.flash_size = 16MB
board_build.arduino.memory_type = dio_qspi

monitor_speed = ${extra.baud}
monitor_filters = esp32_exception_decoder
extra_scripts =
    pre:lib/PocketMage_SDK/pocketmage_i18n/tools/gen_i18n.py
; i18n catalogs are merged in order: SDK base first, then this app's own.
custom_i18n_catalogs = lib/PocketMage_SDK/pocketmage_i18n/languages
custom_i18n_out_dir = lib/PocketMage_SDK/pocketmage_i18n
build_src_filter =
    +<*> -<test/>
build_flags =   
                -DARDUINO_USB_MODE=1
                -DARDUINO_USB_CDC_ON_BOOT=1
                -DARDUINO_RUNNING_CORE=1
                -DARDUINO_EVENT_RUNNING_CORE=1
                -DCORE_DEBUG_LEVEL=3

lib_deps = 
    tobozo/ESP32-targz
    https://github.com/jingoro2112/wrench.git
    https://github.com/ewpa/LibSSH-ESP32.git
    https://github.com/NellowTCS/Mesh-NOW.git#main

; --- PocketMage Production Model (N16R2 - Quad PSRAM Enabled) ---
[env:PM_PRODUCTION]
extends = common
board = esp32-s3-devkitc-1
build_flags = 
    ${common.build_flags} 
    '-DOS_VERSION_STR="V1.8.0"'    ; Software version number
    -DOTA_APP_FLAG=0
    -DPOCKETMAGE_HW_VERSION=2   ; 2 = Production
    -DBOARD_HAS_PSRAM=1         ; Production has Quad PSRAM
    -D CONFIG_MESH_NOW_MAX_NODES=10
    -D CONFIG_MESH_NOW_CHANNEL=1
board_build.partitions = partitions_4APP.csv

; --- PocketMage Beta (N16R8 - PSRAM Forced Disabled) ---
[env:PM_BETA]
extends = common
board = esp32-s3-devkitc-1                 
build_flags = 
    ${common.build_flags} 
    '-DOS_VERSION_STR="BETA V1.8.0"'    ; Software version number
    -DOTA_APP_FLAG=0
    -DPOCKETMAGE_HW_VERSION=1   ; 1 = Beta
    -DBOARD_HAS_PSRAM=0         ; Beta has no PSRAM
    -D CONFIG_MESH_NOW_MAX_NODES=10
    -D CONFIG_MESH_NOW_CHANNEL=1
board_build.partitions = partitions_4APP.csv

; --- UNIVERSAL OTA APP (Hardware Agnostic) ---
[env:OTA_APP]
extends = common
board = esp32-s3-devkitc-1
build_flags= 
    ${common.build_flags} 
    -DOTA_APP_FLAG=1
    -DPOCKETMAGE_HW_VERSION=0   ; 0 = Universal
    -DBOARD_HAS_PSRAM=0         ; No PSRAM for compatibility
board_build.partitions = partitions_OTA_APP.csv