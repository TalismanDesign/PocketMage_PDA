; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build all environments by default, or specify one via CLI
default_envs = PM_PRODUCTION, PM_BETA

[extra]
baud = 115200

[common]
src_dir = src
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
upload_protocol = esptool
upload_speed = 460800
upload_resetmethod = no_reset
board_upload.flash_size = 16MB
board_build.arduino.memory_type = dio_qspi

monitor_speed = ${extra.baud}
monitor_filters = esp32_exception_decoder
extra_scripts =
    pre:lib/PocketMage_SDK/pocketmage_i18n/tools/gen_i18n.py
; i18n catalogs are merged in order: SDK base first, then this app's own.
custom_i18n_catalogs =
    lib/PocketMage_SDK/pocketmage_i18n/languages
    src/i18n
custom_i18n_out_dir = lib/PocketMage_SDK/pocketmage_i18n
build_src_filter =
    +<*> -<test/>
; ESP-IDF settings, applied by rebuilding the framework libs (pioarduino hybrid compile).
; Keep this list identical for all envs; any difference rebuilds ESP-IDF on every env switch.
; CONFIG_SPIRAM=y keeps the stock PSRAM support; PM_BETA still disables it at runtime.
; LibSSH-ESP32 is unstable with hardware SHA under concurrency, so SHA runs in software.
; See: https://github.com/ewpa/LibSSH-ESP32
; Only the MSC device class is used; the console runs on the USB-Serial-JTAG.
; The TinyUSB host stack is unused: keyboard and speaker go through the ESP-IDF usb_host driver.
; components/arduino_tinyusb supplies TinyUSB to this rebuild, which framework-espidf lacks.
custom_sdkconfig =
    CONFIG_SPIRAM=y
    CONFIG_MBEDTLS_HARDWARE_SHA=n
    CONFIG_TINYUSB_HID_ENABLED=n
    CONFIG_TINYUSB_MIDI_ENABLED=n
    CONFIG_TINYUSB_AUDIO_ENABLED=n
    CONFIG_TINYUSB_VIDEO_ENABLED=n
    CONFIG_TINYUSB_DFU_RT_ENABLED=n
    CONFIG_TINYUSB_DFU_ENABLED=n
    CONFIG_TINYUSB_VENDOR_ENABLED=n
    CONFIG_TINYUSB_NCM_ENABLED=n
    CONFIG_TINYUSB_HOST_ENABLED=n
build_flags =   
                -DPM_TARGET_HOST=1
                -DARDUINO_USB_MODE=1
                -DARDUINO_USB_CDC_ON_BOOT=1
                -DARDUINO_RUNNING_CORE=1
                -DARDUINO_EVENT_RUNNING_CORE=1
                -DCORE_DEBUG_LEVEL=3
                -Wl,--wrap=esp_panic_handler
                -Wl,-u,g_esp_elf_static_symbol_registry
                -DCONFIG_ELF_FILE_SYSTEM_BASE_PATH='"/storage"'
                -DCONFIG_ELF_LOADER_LIBC_SYMBOLS
                -DCONFIG_ELF_LOADER_ESPIDF_SYMBOLS
                -DCONFIG_ELF_LOADER_CUSTOMER_SYMBOLS
                -DCONFIG_ELF_LOADER_BUS_ADDRESS_MIRROR=1
                -DELF_OVERLAY_ESP_IDF=1

; Keep LDF from compiling the submodule roots
lib_ignore =
    esp-iot-solution
    esp-adf-libs

lib_deps = 
    https://github.com/jingoro2112/wrench.git
    https://github.com/ewpa/LibSSH-ESP32.git
    https://github.com/NellowTCS/Mesh-NOW.git#main

; --- PocketMage Production Model (N16R2 - Quad PSRAM Enabled) ---
[env:PM_PRODUCTION]
extends = common
board = esp32-s3-devkitc-1
build_flags = 
    ${common.build_flags} 
    '-DOS_VERSION_STR="V1.8.0"'    ; Software version number
    -DPOCKETMAGE_HW_VERSION=2   ; 2 = Production
    -DBOARD_HAS_PSRAM=1         ; Production has Quad PSRAM
    -D CONFIG_MESH_NOW_MAX_NODES=10
    -D CONFIG_MESH_NOW_CHANNEL=1
board_build.partitions = partitions.csv

; --- PocketMage Beta (N16R8 - PSRAM Forced Disabled) ---
[env:PM_BETA]
extends = common
board = esp32-s3-devkitc-1
build_flags =
    ${common.build_flags} 
    '-DOS_VERSION_STR="BETA V1.8.0"'    ; Software version number
    -DPOCKETMAGE_HW_VERSION=1   ; 1 = Beta
    -DESP32_ARDUINO_LIB_BUILDER ; no BOARD_HAS_PSRAM -> core #undefs CONFIG_SPIRAM*
    -D CONFIG_MESH_NOW_MAX_NODES=10
    -D CONFIG_MESH_NOW_CHANNEL=1
board_build.partitions = partitions.csv
