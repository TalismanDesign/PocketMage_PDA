name: Pull Request CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: Docs/package-lock.json

      - name: Build Docs
        working-directory: Docs
        run: |
          set -euo pipefail
          npm ci
          npm run build

  firmware-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - PM_PRODUCTION
          - PM_BETA

    defaults:
      run:
        working-directory: Code/PocketMageOS

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare the Python Cauldron
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          set -euo pipefail
          pip install -U platformio

      - name: Build Firmware Environment
        run: |
          set -euo pipefail
          pio run -e ${{ matrix.env }}

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketmage-${{ matrix.env }}-${{ github.sha }}
          path: |
            Code/PocketMageOS/.pio/build/${{ matrix.env }}/*.bin
            Code/PocketMageOS/.pio/build/${{ matrix.env }}/*.elf
          if-no-files-found: error
          retention-days: 14

  example-app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare the Python Cauldron
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install icon tooling and the SDK
        working-directory: Code/PocketMageOS
        run: |
          set -euo pipefail
          pip install --quiet Pillow
          pip install lib/PocketMage_SDK

      - name: Install Little-Endian Xtensa Toolchain
        run: |
          set -euo pipefail
          VER=esp-15.2.0_20251204
          SHA=3d50f5cd5f173acfd524e07c1cd69bc99585731a415ca2e5bce879997fe602b8
          TGT="$HOME/.espressif/tools/xtensa-esp-elf/$VER"
          URL="https://github.com/espressif/crosstool-NG/releases/download/$VER/xtensa-esp-elf-15.2.0_20251204-x86_64-linux-gnu.tar.xz"
          mkdir -p "$TGT"
          curl -fsSL -o /tmp/xtensa-esp-elf.tar.xz "$URL"
          echo "$SHA  /tmp/xtensa-esp-elf.tar.xz" | sha256sum -c -
          tar -xJf /tmp/xtensa-esp-elf.tar.xz -C "$TGT"
          test -x "$TGT/xtensa-esp-elf/bin/xtensa-esp32s3-elf-g++"
          echo "$TGT/xtensa-esp-elf/bin" >> "$GITHUB_PATH"
          echo "toolchain installed at $TGT/xtensa-esp-elf"

      - name: Build the elf_overlay host tools
        working-directory: Code/PocketMageOS/lib/elf_overlay
        run: |
          set -euo pipefail
          cmake -S . -B build
          cmake --build build --target elf_overlay_relink elf_overlay_emit
          echo "$PWD/build" >> "$GITHUB_PATH"

      - name: Build Example App
        working-directory: Code/PocketMageOS
        env:
          PM_SDK_ROOT: ${{ github.workspace }}/Code/PocketMageOS/lib/PocketMage_SDK
        run: |
          set -euo pipefail
          APP=lib/PocketMage_SDK/tools/pm/tests/fixtures/template
          make -C "$APP" clean all pack
          pm check "$APP"

      - name: Assert artifact little-endian
        working-directory: Code/PocketMageOS/lib/PocketMage_SDK/tools/pm/tests/fixtures/template/build
        run: |
          set -euo pipefail
          xtensa-esp-elf-readelf -h template.app.elf | grep -q 'little endian'
          tar -tf template.tar | grep -q -- 'template.app.elf'
          tar -tf template.tar | grep -q -- 'template.elfo'
          tar -tf template.tar | grep -q -- 'template_ICON.bin'

      - name: Upload App Tar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-app-${{ github.sha }}
          path: |
            Code/PocketMageOS/lib/PocketMage_SDK/tools/pm/tests/fixtures/template/build/template.tar
            Code/PocketMageOS/lib/PocketMage_SDK/tools/pm/tests/fixtures/template/build/template.app.elf
          if-no-files-found: error
          retention-days: 14

  i18n-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Code/PocketMageOS

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare the Python Cauldron
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate i18n tables from stored catalogs
        run: |
          set -euo pipefail
          mkdir -p /tmp/pm-i18n/base /tmp/pm-i18n/merged
          python lib/PocketMage_SDK/pocketmage_i18n/tools/gen_i18n.py --force \
            --catalog lib/PocketMage_SDK/pocketmage_i18n/languages \
            --out-dir /tmp/pm-i18n/base
          python lib/PocketMage_SDK/pocketmage_i18n/tools/gen_i18n.py --force \
            --catalog lib/PocketMage_SDK/pocketmage_i18n/languages \
            --catalog src/i18n \
            --out-dir /tmp/pm-i18n/merged

      - name: Assert app catalog merged in
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          base = set(re.findall(r"STR_[A-Z0-9_]*", open("/tmp/pm-i18n/base/pocketmage_i18n_gen.h").read()))
          merged = set(re.findall(r"STR_[A-Z0-9_]*", open("/tmp/pm-i18n/merged/pocketmage_i18n_gen.h").read()))
          assert merged > base, f"app catalog did not merge into tables (base {len(base)}, merged {len(merged)})"
          print(f"i18n OK: {len(base)} SDK base + {len(merged - base)} app strings = {len(merged)} total")
          PY